name: Bug report
description: Something is wrong with a screw, a hole or the add-on
labels: [bug]
body:
  - type: input
    id: blender
    attributes:
      label: Blender version and OS
      placeholder: e.g. Blender 5.2.3, Windows 11
    validations:
      required: true
  - type: input
    id: talos
    attributes:
      label: Talos version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The screw settings (type, size, joint), what you expected, what you got. Screenshots help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the attached .blend\n2. Talos tab ‣ Place by Clicking\n3. ..."
  - type: textarea
    id: log
    attributes:
      label: Error message
      description: Any error shown by Blender (Info editor, or Window ‣ Toggle System Console on Windows).
      render: text
